# Publishing a release: merge dev into main, then push a tag on main:
#   git checkout main && git pull && git tag v1.0.1 && git push origin v1.0.1
# This builds the Claude.ai skill zip and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tag is on main and matches plugin.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tags are only released from main."; exit 1; }
          v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] \
            || { echo "Tag $GITHUB_REF_NAME does not match plugin.json version $v"; exit 1; }

      - name: Validate
        run: npx --yes @anthropic-ai/claude-code@2.1.308 plugin validate . --strict

      - name: Build the skill zip
        run: ./scripts/package-skill.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/seculynx-diagnostic-skill.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
